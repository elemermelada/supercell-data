[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/F = pyflakes + pycodestyle, I = import sorting
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
# Make discovery explicit about rootdir: tests live under tests/, and the repo
# root is put on sys.path so `import retrieve` / `import config` resolve the
# same way whether run via pytest or `python -m unittest`.
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
